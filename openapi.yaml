      responses:
        '200':
          description: Discovery feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of mixed content (MoodboardPost or UserShare objects) personalized for the user
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/MoodboardPost'
                        - $ref: '#/components/schemas/UserShare'
                  total:
                    type: integer
                    description: Total number of items in the discovery feed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    User:
      type: object
      required:
        - userId
        - email
        - username
      properties:
        userId:
          type: string
          description: Unique identifier for the user
          example: "u_abc123xyz"
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_-]+$'
          description: User's unique username (alphanumeric, underscore, and hyphen only)
          example: "aesthetic_anna"
        avatar:
          type: string
          format: uri
          description: URL to user's profile avatar image
          example: "https://cdn.vibecheck.com/avatars/user123.jpg"
        bio:
          type: string
          maxLength: 500
          description: User's profile biography
          example: "Cinema enthusiast | Dark academia vibes"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user profile was last updated
          example: "2024-02-10T14:22:00Z"

    Movie:
      type: object
      required:
        - id
        - title
        - year
        - director
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the movie or TV show
          example: "movie_inception_2010"
        title:
          type: string
          description: Title of the movie or TV show
          example: "Inception"
        year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Release year
          example: 2010
        director:
          type: string
          description: Director's name
          example: "Christopher Nolan"
        poster:
          type: string
          format: uri
          description: URL to the movie/show poster image
          example: "https://cdn.vibecheck.com/posters/inception.jpg"
        season:
          type: integer
          minimum: 1
          description: Season number (only for TV shows)
          example: 1
        episode:
          type: integer
          minimum: 1
          description: Episode number (only for TV shows)
          example: 5
        type:
          type: string
          enum: [movie, tv]
          description: Content type - either a standalone movie or TV show
          example: "movie"
        url:
          type: string
          format: uri
          description: External URL with more information (e.g., IMDb link)
          example: "https://www.imdb.com/title/tt1375666/"

    Album:
      type: object
      required:
        - id
        - title
        - artist
      properties:
        id:
          type: string
          description: Unique identifier for the album
          example: "album_dsotm_1973"
        title:
          type: string
          description: Album title
          example: "The Dark Side of the Moon"
        artist:
          type: string
          description: Artist or band name
          example: "Pink Floyd"
        cover:
          type: string
          format: uri
          description: URL to the album cover artwork
          example: "https://cdn.vibecheck.com/covers/dsotm.jpg"
        duration:
          type: integer
          minimum: 0
          description: Total album duration in seconds
          example: 2592
        url:
          type: string
          format: uri
          description: External URL with more information (e.g., Spotify link)
          example: "https://open.spotify.com/album/4LH4d3cOWNNsVw41Gqt2kv"

    Game:
      type: object
      required:
        - id
        - title
        - platform
      properties:
        id:
          type: string
          description: Unique identifier for the game
          example: "game_zelda_botw"
        title:
          type: string
          description: Game title
          example: "The Legend of Zelda: Breath of the Wild"
        platform:
          type: string
          description: Gaming platform (e.g., PlayStation, Xbox, PC, Nintendo Switch)
          example: "Nintendo Switch"
        cover:
          type: string
          format: uri
          description: URL to the game cover art
          example: "https://cdn.vibecheck.com/games/zelda_botw.jpg"
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
          description: Game difficulty level
          example: "Medium"
        url:
          type: string
          format: uri
          description: External URL with more information
          example: "https://www.nintendo.com/games/detail/zelda-botw/"

    Book:
      type: object
      required:
        - id
        - title
        - author
      properties:
        id:
          type: string
          description: Unique identifier for the book
          example: "book_1984_orwell"
        title:
          type: string
          description: Book title
          example: "1984"
        author:
          type: string
          description: Author's name
          example: "George Orwell"
        cover:
          type: string
          format: uri
          description: URL to the book cover image
          example: "https://cdn.vibecheck.com/books/1984.jpg"
        totalPages:
          type: integer
          minimum: 1
          description: Total number of pages in the book
          example: 328
        url:
          type: string
          format: uri
          description: External URL with more information (e.g., Goodreads link)
          example: "https://www.goodreads.com/book/show/5470.1984"

    Location:
      type: object
      required:
        - id
        - name
        - city
        - country
      properties:
        id:
          type: string
          description: Unique identifier for the travel destination
          example: "location_eiffel_tower"
        name:
          type: string
          description: Name of the location or landmark
          example: "Eiffel Tower"
        city:
          type: string
          description: City where the location is situated
          example: "Paris"
        country:
          type: string
          description: Country where the location is situated
          example: "France"
        image:
          type: string
          format: uri
          description: URL to an image of the location
          example: "https://cdn.vibecheck.com/locations/eiffel.jpg"
        weather:
          type: string
          description: Current weather condition description
          example: "Partly cloudy"
        temperature:
          type: number
          format: float
          description: Current temperature in Celsius
          example: 18.5
        timezone:
          type: string
          description: IANA timezone identifier for the location
          example: "Europe/Paris"
        url:
          type: string
          format: uri
          description: External URL with more information about the location
          example: "https://www.toureiffel.paris/en"

    UserShare:
      type: object
      required:
        - id
        - category
        - title
      properties:
        id:
          type: string
          description: Unique identifier for the share
          example: "share_xyz789"
        userId:
          type: string
          description: ID of the user who created this share
          example: "u_abc123xyz"
        category:
          type: string
          enum: [cinema, music, games, books, travel]
          description: Content category of the shared item
          example: "cinema"
        title:
          type: string
          description: Title of the shared content
          example: "Inception"
        image:
          type: string
          format: uri
          description: URL to the shared content's image
          example: "https://cdn.vibecheck.com/shares/inception.jpg"
        dominantColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code of the image's dominant color (used for UI theming)
          example: "#1A3B5C"
        caption:
          type: string
          maxLength: 500
          description: User's personal caption or note about the shared content
          example: "Mind-bending masterpiece!"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the share was created
          example: "2024-02-15T18:30:00Z"

    AuraProfile:
      type: object
      required:
        - userId
        - username
      properties:
        userId:
          type: string
        username:
          type: string
        avatar:
          type: string
          format: uri
        bio:
          type: string
        recentShares:
          type: array
          description: User's recent content shares across all categories
          items:
            $ref: '#/components/schemas/UserShare'
        auraColors:
          type: array
          description: "Array of hex color codes (format: #RRGGBB) representing user's aesthetic aura"
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            example: '#FF6B9D'
        aestheticTags:
          type: array
          description: Array of aesthetic style tags (e.g., minimalist, vintage, dark academia)
          items:
            type: string
            example: minimalist
        topCategories:
          type: array
          description: User's content distribution across categories with percentage breakdown
          items:
            type: object
            properties:
              category:
                type: string
                description: Content category (cinema, music, games, books, travel)
              percentage:
                type: number
                minimum: 0
                maximum: 100
                description: Percentage of user's content in this category

    AuraMatch:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuraProfile'
        similarityScore:
          type: integer
          minimum: 0
          maximum: 100
        sharedAesthetics:
          type: array
          description: Array of aesthetic tags shared between matched users
          items:
            type: string
            example: vintage
        matchReason:
          type: string

    Badge:
      type: object
      required:
        - id
        - name
        - rarity
      properties:
        id:
          type: string
          description: Unique identifier for the badge
          example: "badge_early_bird"
        name:
          type: string
          description: Display name of the badge
          example: "Early Bird"
        description:
          type: string
          description: Description of how to earn this badge
          example: "Shared content in the first week after joining"
        icon:
          type: string
          format: uri
          description: URL to the badge icon image
          example: "https://cdn.vibecheck.com/badges/early_bird.svg"
        rarity:
          type: string
          enum: [common, rare, epic, legendary]
          description: Badge rarity level indicating how difficult it is to obtain
          example: "rare"
        category:
          type: string
          enum: [early, completionist, social, streak, special]
          description: Badge category grouping similar achievement types
          example: "early"
        unlocked:
          type: boolean
          description: Whether the current user has unlocked this badge
          example: true
        unlockedDate:
          type: string
          format: date-time
          description: Timestamp when the user unlocked this badge (null if not unlocked)
          example: "2024-01-20T12:00:00Z"
        progress:
          type: integer
          minimum: 0
          description: Current progress towards unlocking this badge
          example: 3
        maxProgress:
          type: integer
          minimum: 1
          description: Total progress required to unlock this badge
          example: 5

    CuratorLevel:
      type: object
      required:
        - level
        - name
        - xpRequired
      properties:
        level:
          type: integer
          minimum: 1
          description: The curator level number
          example: 5
        name:
          type: string
          description: Display name for this curator level
          example: "Aesthetic Connoisseur"
        xpRequired:
          type: integer
          minimum: 0
          description: Total XP required to reach this level
          example: 5000
        rewards:
          type: array
          description: Array of rewards granted when reaching this curator level
          items:
            type: string
            example: "Unlock dark theme"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code representing this level's badge color
          example: "#8B5CF6"

    UserStats:
      type: object
      required:
        - totalShares
        - totalXP
        - currentLevel
      properties:
        totalShares:
          type: integer
          minimum: 0
          description: Total number of content items shared by the user
          example: 156
        totalXP:
          type: integer
          minimum: 0
          description: Total experience points (XP) earned by the user
          example: 4820
        currentLevel:
          type: integer
          minimum: 1
          description: User's current curator level
          example: 5
        streakDays:
          type: integer
          minimum: 0
          description: Number of consecutive days with activity
          example: 14
        badges:
          type: array
          description: Array of earned and available badges for the user
          items:
            $ref: '#/components/schemas/Badge'
        completedFilmographies:
          type: array
          description: Array of director/artist names whose full filmographies have been viewed
          items:
            type: string
            example: "Greta Gerwig"
        finishedBooks:
          type: integer
          minimum: 0
          description: Total number of books marked as finished
          example: 23
        earlyDiscoveries:
          type: integer
          minimum: 0
          description: Number of content items discovered before they became popular
          example: 8

    MoodboardPost:
      type: object
      required:
        - id
        - userId
        - username
        - category
        - title
        - image
      properties:
        id:
          type: string
          description: Unique identifier for the moodboard post
          example: "post_abc123"
        userId:
          type: string
          description: ID of the user who created the post
          example: "u_abc123xyz"
        username:
          type: string
          description: Username of the post author
          example: "aesthetic_anna"
        userAvatar:
          type: string
          format: uri
          description: URL to the post author's avatar image
          example: "https://cdn.vibecheck.com/avatars/user123.jpg"
        category:
          type: string
          enum: [cinema, music, games, books, travel]
          description: Content category of the post
          example: "cinema"
        title:
          type: string
          description: Title or caption of the moodboard post
          example: "Film Noir Collection"
        image:
          type: string
          format: uri
          description: URL to the post's image or moodboard collage
          example: "https://cdn.vibecheck.com/posts/noir_collection.jpg"
        dominantColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code of the dominant color in the image
          example: "#1A1A1A"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the post was created
          example: "2024-02-15T18:30:00Z"
        likes:
          type: integer
          minimum: 0
          description: Number of likes received on this post
          example: 128
        comments:
          type: integer
          minimum: 0
          description: Number of comments on this post
          example: 24

    AestheticRoom:
      type: object
      required:
        - id
        - name
        - hashtag
      properties:
        id:
          type: string
          description: Unique identifier for the aesthetic room
          example: "room_darkacademia"
        name:
          type: string
          description: Display name of the aesthetic room
          example: "Dark Academia"
        hashtag:
          type: string
          pattern: '^#[a-zA-Z0-9_]+$'
          description: Hashtag associated with this room
          example: "#darkacademia"
        description:
          type: string
          description: Description of the aesthetic room's theme
          example: "Classical literature, vintage fashion, and intellectual pursuits"
        coverGradient:
          type: string
          description: CSS gradient string for the room's cover design
          example: "linear-gradient(135deg, #2E3440 0%, #4C566A 100%)"
        memberCount:
          type: integer
          minimum: 0
          description: Number of users who have joined this room
          example: 1542
        postCount:
          type: integer
          minimum: 0
          description: Total number of posts in this room
          example: 3891
        trending:
          type: boolean
          description: Whether this room is currently trending
          example: true
        posts:
          type: array
          description: Array of moodboard posts in this aesthetic room
          items:
            $ref: '#/components/schemas/MoodboardPost'
        moderators:
          type: array
          description: Array of user IDs who moderate this room
          items:
            type: string
            description: User ID of a moderator
            example: "u_moderator_123"

    Comment:
      type: object
      required:
        - id
        - userId
        - username
        - text
      properties:
        id:
          type: string
          description: Unique identifier for the comment
          example: "comment_xyz123"
        userId:
          type: string
          description: ID of the user who posted the comment
          example: "u_abc123xyz"
        username:
          type: string
          description: Username of the comment author
          example: "aesthetic_anna"
        userAvatar:
          type: string
          format: uri
          description: URL to the comment author's avatar image
          example: "https://cdn.vibecheck.com/avatars/user123.jpg"
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Comment text content
          example: "Love this aesthetic!"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the comment was posted
          example: "2024-02-16T09:45:00Z"
        likes:
          type: integer
          minimum: 0
          description: Number of likes received on this comment
          example: 42

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return per request (pagination)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Offset:
      name: offset
      in: query
      description: Number of items to skip before starting to return results (pagination)
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    Categories:
      name: categories
      in: query
      description: "Filter by categories (CSV list: cinema,music,games,books,travel)"
      style: form
      explode: false
      schema:
        type: array
        description: Array of category filters to apply
        items:
          type: string
          enum: [cinema, music, games, books, travel]
          description: Content category name

  responses:
    BadRequest:
      description: Bad request - invalid parameters or malformed request
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
            properties:
              error:
                type: string
                description: Error type identifier
                example: "INVALID_PARAMETER"
              message:
                type: string
                description: Human-readable error message
                example: "The 'year' parameter must be between 1900 and 2100"

    UnauthorizedError:
      description: Authentication required - missing or invalid access token
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
            properties:
              error:
                type: string
                description: Error type identifier
                example: "UNAUTHORIZED"
              message:
                type: string
                description: Human-readable error message
                example: "Authentication token is missing or invalid"

    NotFound:
      description: Resource not found - the requested resource does not exist
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
            properties:
              error:
                type: string
                description: Error type identifier
                example: "NOT_FOUND"
              message:
                type: string
                description: Human-readable error message
                example: "The requested resource could not be found"

    ServerError:
      description: Internal server error - an unexpected error occurred
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
            properties:
              error:
                type: string
                description: Error type identifier
                example: "INTERNAL_ERROR"
              message:
                type: string
                description: Human-readable error message
                example: "An unexpected error occurred. Please try again later."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT