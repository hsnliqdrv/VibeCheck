openapi: 3.0.3
info:
  title: VibeCheck - Aesthetic Social Media Companion API
  description: |
    API specification for VibeCheck, an aesthetic social media companion application.
    Users can curate content across multiple categories (cinema, music, games, books, travel),
    share their aesthetic identity (aura), earn badges through gamification, and discover
    like-minded users in aesthetic communities.
  version: 1.0.0
  contact:
    name: VibeCheck Support
  license:
    name: MIT

servers:
  - url: https://api.vibecheck.com/v1
    description: Production server
  - url: https://staging-api.vibecheck.com/v1
    description: Staging server
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Content
    description: Browse and manage content across categories
  - name: User Profile
    description: User profile and authentication endpoints
  - name: Aura
    description: User aesthetic identity and aura matching
  - name: Badges & Gamification
    description: Badges, levels, and curator progression
  - name: Social
    description: Community posts, rooms, and discovery
  - name: Search
    description: Search and filtering operations

paths:
  /auth/login:
    post:
      tags:
        - User Profile
      summary: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: user@example.com
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                user:
                  userId: "u_123"
                  email: user@example.com
                  username: aesthetic_anna
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/register:
    post:
      tags:
        - User Profile
      summary: User registration
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username already exists
        '500':
          $ref: '#/components/responses/ServerError'

  /users/profile:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - User Profile
      summary: Update user profile
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  maxLength: 500
                avatar:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/{userId}:
    get:
      tags:
        - User Profile
      summary: Get user profile by ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/movies:
    get:
      tags:
        - Content
      summary: Get all movies
      operationId: getMovies
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search by title or director
          example: "Inception"
        - name: year
          in: query
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
          description: Filter by release year
          example: 2010
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, tv]
          description: Filter by content type (movie or TV show)
          example: "movie"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Movies list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Movie objects
                    items:
                      $ref: '#/components/schemas/Movie'
                  total:
                    type: integer
                    description: Total number of movies matching the query
                  limit:
                    type: integer
                    description: Maximum items returned per request
                  offset:
                    type: integer
                    description: Pagination offset value
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/movies/{movieId}:
    get:
      tags:
        - Content
      summary: Get movie details
      operationId: getMovieById
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/albums:
    get:
      tags:
        - Content
      summary: Get all albums
      operationId: getAlbums
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search albums by title or artist name
          example: "Dark Side of the Moon"
        - name: artist
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Filter albums by specific artist name
          example: "Pink Floyd"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Albums list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Album objects
                    items:
                      $ref: '#/components/schemas/Album'
                  total:
                    type: integer
                    description: Total number of albums matching the query
                  limit:
                    type: integer
                    description: Maximum items returned per request
                  offset:
                    type: integer
                    description: Pagination offset value
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/albums/{albumId}:
    get:
      tags:
        - Content
      summary: Get album details
      operationId: getAlbumById
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Album details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/games:
    get:
      tags:
        - Content
      summary: Get all games
      operationId: getGames
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search games by title
          example: "The Legend of Zelda"
        - name: platform
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 50
          description: Filter by gaming platform (e.g., PlayStation, Xbox, PC, Nintendo Switch)
          example: "Nintendo Switch"
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [Easy, Medium, Hard]
          description: Filter by game difficulty level
          example: "Medium"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Games list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Game objects
                    items:
                      $ref: '#/components/schemas/Game'
                  total:
                    type: integer
                    description: Total number of games matching the query
                  limit:
                    type: integer
                    description: Maximum items returned per request
                  offset:
                    type: integer
                    description: Pagination offset value
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/games/{gameId}:
    get:
      tags:
        - Content
      summary: Get game details
      operationId: getGameById
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/books:
    get:
      tags:
        - Content
      summary: Get all books
      operationId: getBooks
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search books by title or author name
          example: "1984"
        - name: author
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Filter books by specific author name
          example: "George Orwell"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Books list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Book objects
                    items:
                      $ref: '#/components/schemas/Book'
                  total:
                    type: integer
                    description: Total number of books matching the query
                  limit:
                    type: integer
                    description: Maximum items returned per request
                  offset:
                    type: integer
                    description: Pagination offset value
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/books/{bookId}:
    get:
      tags:
        - Content
      summary: Get book details
      operationId: getBookById
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/locations:
    get:
      tags:
        - Content
      summary: Get all travel destinations
      operationId: getLocations
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search travel destinations by location name or city
          example: "Paris"
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Filter destinations by country name
          example: "France"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Locations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Location objects
                    items:
                      $ref: '#/components/schemas/Location'
                  total:
                    type: integer
                    description: Total number of locations matching the query
                  limit:
                    type: integer
                    description: Maximum items returned per request
                  offset:
                    type: integer
                    description: Pagination offset value
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /content/locations/{locationId}:
    get:
      tags:
        - Content
      summary: Get location details
      operationId: getLocationById
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /search:
    get:
      tags:
        - Search
      summary: Global search across all content
      operationId: globalSearch
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Search query string to find content across all categories
          example: "synthwave"
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: Array of mixed content objects matching the search query (Movie, Album, Game, Book, or Location)
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Movie'
                        - $ref: '#/components/schemas/Album'
                        - $ref: '#/components/schemas/Game'
                        - $ref: '#/components/schemas/Book'
                        - $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /aura/profile:
    get:
      tags:
        - Aura
      summary: Get current user's aura profile
      operationId: getCurrentUserAura
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aura profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuraProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - Aura
      summary: Update aura profile
      operationId: updateAuraProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aestheticTags:
                  type: array
                  description: Array of aesthetic style tags (e.g., minimalist, vintage, dark academia)
                  maxItems: 10
                  items:
                    type: string
                    minLength: 2
                    maxLength: 30
                    example: "dark academia"
                auraColors:
                  type: array
                  description: Array of hex color codes representing user's aesthetic palette
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    pattern: '^#[0-9A-Fa-f]{6}$'
                    example: "#2E3440"
      responses:
        '200':
          description: Aura profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuraProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /aura/profile/{userId}:
    get:
      tags:
        - Aura
      summary: Get user's aura profile
      operationId: getUserAura
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aura profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuraProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /aura/shares:
    get:
      tags:
        - Aura
      summary: Get current user's shares
      operationId: getUserShares
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User shares list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of UserShare objects
                    items:
                      $ref: '#/components/schemas/UserShare'
                  total:
                    type: integer
                    description: Total number of shares
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Aura
      summary: Create a new share
      operationId: createShare
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - contentId
              properties:
                category:
                  type: string
                  enum: [cinema, music, games, books, travel]
                  description: Content category for the share
                  example: "cinema"
                contentId:
                  type: string
                  description: ID of the content item being shared (movie, album, game, book, or location)
                  example: "movie_inception_2010"
                caption:
                  type: string
                  maxLength: 500
                  description: Optional caption or personal note about the shared content
                  example: "This movie changed how I think about dreams!"
      responses:
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserShare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /aura/matches:
    get:
      tags:
        - Aura
      summary: Get aura matches (similar users)
      operationId: getAuraMatches
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of aura matches to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          description: Number of results to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of aura matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of AuraMatch objects representing compatible users
                    items:
                      $ref: '#/components/schemas/AuraMatch'
                  total:
                    type: integer
                    description: Total number of aura matches found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /aura/compatibility/{userId}:
    get:
      tags:
        - Aura
      summary: Calculate compatibility with another user
      operationId: calculateCompatibility
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compatibility score
          content:
            application/json:
              schema:
                type: object
                properties:
                  compatibilityScore:
                    type: integer
                    minimum: 0
                    maximum: 100
                  sharedAesthetics:
                    type: array
                    description: Aesthetic tags and categories shared between the two users
                    items:
                      type: string
                      example: dark academia
                  matchReason:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /badges:
    get:
      tags:
        - Badges & Gamification
      summary: Get all available badges
      operationId: getAllBadges
      parameters:
        - name: rarity
          in: query
          description: Filter badges by rarity level
          schema:
            type: string
            enum: [common, rare, epic, legendary]
          example: "rare"
        - name: category
          in: query
          description: Filter badges by achievement category
          schema:
            type: string
            enum: [early, completionist, social, streak, special]
          example: "social"
      responses:
        '200':
          description: List of badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Badge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /badges/user:
    get:
      tags:
        - Badges & Gamification
      summary: Get current user's badges
      operationId: getUserBadges
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User's badges
          content:
            application/json:
              schema:
                type: object
                properties:
                  badges:
                    type: array
                    description: Array of Badge objects earned by the user
                    items:
                      $ref: '#/components/schemas/Badge'
                  unlockedCount:
                    type: integer
                    description: Number of badges unlocked by the user
                  totalCount:
                    type: integer
                    description: Total number of badges available in the system
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /badges/user/{userId}:
    get:
      tags:
        - Badges & Gamification
      summary: Get user's badges
      operationId: getUserBadgesById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User's badges
          content:
            application/json:
              schema:
                type: object
                properties:
                  badges:
                    type: array
                    description: Array of Badge objects earned by the user
                    items:
                      $ref: '#/components/schemas/Badge'
                  unlockedCount:
                    type: integer
                    description: Number of badges unlocked by this user
                  totalCount:
                    type: integer
                    description: Total number of badges available in the system
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /curator/stats:
    get:
      tags:
        - Badges & Gamification
      summary: Get current user's curator stats
      operationId: getCuratorStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Curator statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /curator/stats/{userId}:
    get:
      tags:
        - Badges & Gamification
      summary: Get user's curator stats
      operationId: getCuratorStatsByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curator statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /curator/levels:
    get:
      tags:
        - Badges & Gamification
      summary: Get all curator levels
      operationId: getCuratorLevels
      responses:
        '200':
          description: List of curator levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuratorLevel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /social/posts:
    get:
      tags:
        - Social
      summary: Get community posts
      operationId: getCommunityPosts
      parameters:
        - name: category
          in: query
          description: Filter posts by content category
          schema:
            type: string
            enum: [cinema, music, games, books, travel]
          example: "cinema"
        - name: sortBy
          in: query
          description: Sort order for community posts
          schema:
            type: string
            enum: [recent, trending, liked]
            default: recent
          example: "trending"
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Community posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of MoodboardPost objects
                    items:
                      $ref: '#/components/schemas/MoodboardPost'
                  total:
                    type: integer
                    description: Total number of community posts
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Social
      summary: Create a community post
      operationId: createCommunityPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - title
                - image
              properties:
                category:
                  type: string
                  enum: [cinema, music, games, books, travel]
                  description: Content category for the post
                  example: "cinema"
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Title or caption for the moodboard post
                  example: "My favorite noir films"
                image:
                  type: string
                  format: uri
                  description: URL to the post's image or collage
                  example: "https://cdn.vibecheck.com/images/post123.jpg"
                dominantColor:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  description: Hex color code representing the dominant color in the image
                  example: "#1A1A1A"
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodboardPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /social/posts/{postId}:
